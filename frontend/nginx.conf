server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index principal.html index.html;

    # Otimização com compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rota inicial do sistema
    location = / {
        try_files /principal.html /index.html =404;
    }

    # Proxy reverso transparente para o backend Flask/Gunicorn
    location ~ ^/(api|animais|resgates|consultar|inserir|apagar|alterar) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Arquivos estáticos do frontend (páginas HTML, CSS, JS, imagens)
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache de assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /principal.html;
}
