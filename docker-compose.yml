services:
  # Servidor Backend: API REST Python Flask + Gunicorn + SQLite
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patas-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FLASK_DEBUG=false
      - DATABASE_PATH=/app/data/patas_vidas.db
    volumes:
      # Persistência dos dados do SQLite
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - patas-network

  # Servidor Frontend: Servidor Nginx de alta performance com Proxy Reverso
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patas-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - patas-network

volumes:
  backend_data:
    driver: local

networks:
  patas-network:
    driver: bridge
